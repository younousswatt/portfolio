<svg width="640" height="720" viewBox="0 0 640 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="avatarTitle avatarDesc">
  <title id="avatarTitle">Younouss Watt portrait</title>
  <desc id="avatarDesc">Illustration of a 21-year-old man with black hair, brown skin and rectangular glasses.</desc>

  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8EB"/>
    </linearGradient>
    <linearGradient id="skinGradient" x1="140" y1="120" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B4785A"/>
      <stop offset="100%" stop-color="#9A6242"/>
    </linearGradient>
  </defs>

  <rect width="640" height="720" fill="url(#bgGradient)"/>

  <!-- Abstract background elements -->
  <circle cx="320" cy="360" r="280" fill="rgba(0, 113, 227, 0.03)"/>
  <circle cx="200" cy="200" r="120" fill="rgba(0, 113, 227, 0.02)"/>
  <circle cx="480" cy="500" r="100" fill="rgba(0, 113, 227, 0.02)"/>

  <!-- Person illustration - young man, black hair, brown skin, glasses -->
  <g transform="translate(140, 80)">
    <!-- Shoulders / upper body (tee) -->
    <path d="M118 470 C150 442 190 432 220 432 C250 432 290 442 322 470 L334 548 L106 548 Z" fill="#1D1D1F"/>
    <!-- Inner neck shadow / collar -->
    <path d="M194 434 C200 450 240 450 246 434 C242 452 198 452 194 434 Z" fill="#8A5233"/>

    <!-- Neck -->
    <path d="M190 348 L190 412 Q220 426 250 412 L250 348 Z" fill="#8A5233"/>
    <!-- Shadow under the jaw -->
    <ellipse cx="220" cy="356" rx="42" ry="15" fill="#6E3B24" opacity="0.38"/>

    <!-- Ears -->
    <ellipse cx="134" cy="248" rx="13" ry="22" fill="#8A5233"/>
    <ellipse cx="306" cy="248" rx="13" ry="22" fill="#8A5233"/>

    <!-- Face shape -->
    <path d="M132 212 C132 152 168 128 220 128 C272 128 308 152 308 212 C308 254 306 296 294 320 C282 346 254 364 220 364 C186 364 158 346 146 320 C134 296 132 254 132 212 Z" fill="url(#skinGradient)"/>

    <!-- Jaw / cheek definition -->
    <path d="M148 306 C154 340 184 360 220 360 C256 360 286 340 292 306 C292 348 262 356 220 356 C178 356 148 348 148 306 Z" fill="#8A5233" opacity="0.22"/>
    <!-- Forehead highlight -->
    <ellipse cx="214" cy="188" rx="34" ry="18" fill="#C08558" opacity="0.35"/>

    <!-- Hair - black, short modern style -->
    <path d="M126 214 C120 158 156 114 220 112 C284 114 320 158 314 214 C312 190 306 172 292 160 C274 146 252 152 220 152 C188 152 166 146 148 160 C134 172 128 190 126 214 Z" fill="#14100E"/>
    <!-- Sideburns -->
    <rect x="130" y="200" width="11" height="36" rx="5.5" fill="#14100E"/>
    <rect x="299" y="200" width="11" height="36" rx="5.5" fill="#14100E"/>

    <!-- Eyebrows -->
    <path d="M160 220 C178 212 204 213 222 219" stroke="#14100E" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M238 219 C256 213 282 212 300 220" stroke="#14100E" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <circle cx="183" cy="250" r="7" fill="#3A2418"/>
    <circle cx="183" cy="250" r="3" fill="#14100E"/>
    <circle cx="185.5" cy="247.5" r="1.8" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="277" cy="250" r="7" fill="#3A2418"/>
    <circle cx="277" cy="250" r="3" fill="#14100E"/>
    <circle cx="279.5" cy="247.5" r="1.8" fill="#FFFFFF" opacity="0.85"/>

    <!-- Glasses - modern rectangular -->
    <g stroke="#17161A" stroke-width="3.5" fill="none" stroke-linecap="round">
      <rect x="150" y="230" width="68" height="46" rx="10" fill="rgba(255,255,255,0.10)"/>
      <rect x="242" y="230" width="68" height="46" rx="10" fill="rgba(255,255,255,0.10)"/>
      <line x1="218" y1="250" x2="242" y2="250"/>
      <line x1="150" y1="242" x2="132" y2="236"/>
      <line x1="310" y1="242" x2="328" y2="236"/>
    </g>

    <!-- Nose -->
    <path d="M219 254 L217 290 Q219 297 227 296" stroke="#6E3B24" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Subtle facial hair (stubble) -->
    <path d="M200 316 Q220 322 240 316 Q236 331 220 333 Q204 331 200 316 Z" fill="#5A3419" opacity="0.18"/>
    <path d="M206 344 Q220 356 234 344 Q230 360 220 360 Q210 360 206 344 Z" fill="#5A3419" opacity="0.14"/>

    <!-- Mouth - subtle smile -->
    <path d="M196 328 Q220 344 246 328" stroke="#6E3B24" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Decorative tech elements -->
  <g opacity="0.15">
    <rect x="50" y="550" width="60" height="60" rx="12" fill="#0071E3"/>
    <rect x="530" y="100" width="40" height="40" rx="8" fill="#0071E3"/>
    <circle cx="560" cy="600" r="25" fill="#0071E3"/>
  </g>
</svg>