<svg width="640" height="720" viewBox="0 0 640 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="640" height="720" fill="#F5F5F7"/>
  
  <!-- Subtle gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8EB"/>
    </linearGradient>
    <linearGradient id="skinGradient" x1="0" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F12"/>
    </linearGradient>
  </defs>
  
  <rect width="640" height="720" fill="url(#bgGradient)"/>
  
  <!-- Abstract background elements -->
  <circle cx="320" cy="360" r="280" fill="rgba(0, 113, 227, 0.03)"/>
  <circle cx="200" cy="200" r="120" fill="rgba(0, 113, 227, 0.02)"/>
  <circle cx="480" cy="500" r="100" fill="rgba(0, 113, 227, 0.02)"/>
  
  <!-- Person illustration - simplified modern style -->
  <g transform="translate(140, 80)">
    <!-- Neck -->
    <path d="M220 380 L220 450" stroke="#6B4F12" stroke-width="40" stroke-linecap="round"/>
    
    <!-- Shoulders/Upper body -->
    <path d="M120 450 Q180 430 220 450 Q260 430 320 450 L320 520 L120 520 Z" fill="#1D1D1F"/>
    
    <!-- Face shape -->
    <ellipse cx="220" cy="260" rx="90" ry="110" fill="#8B6914"/>
    
    <!-- Hair - black, short modern style -->
    <path d="M130 200 Q140 140 220 130 Q300 140 310 200 Q310 180 290 160 Q260 140 220 135 Q180 140 150 160 Q130 180 130 200" fill="#1D1D1F"/>
    <path d="M140 190 Q150 150 220 140 Q290 150 300 190" fill="#1D1D1F"/>
    
    <!-- Ears -->
    <ellipse cx="132" cy="260" rx="12" ry="20" fill="#6B4F12"/>
    <ellipse cx="308" cy="260" rx="12" ry="20" fill="#6B4F12"/>
    
    <!-- Eyebrows -->
    <path d="M160 220 Q185 215 210 220" stroke="#1D1D1F" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M230 220 Q255 215 280 220" stroke="#1D1D1F" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Glasses - modern rectangular -->
    <g stroke="#1D1D1F" stroke-width="3" fill="none">
      <!-- Left lens -->
      <rect x="145" y="225" width="70" height="45" rx="8" fill="rgba(255,255,255,0.1)"/>
      <!-- Right lens -->
      <rect x="225" y="225" width="70" height="45" rx="8" fill="rgba(255,255,255,0.1)"/>
      <!-- Bridge -->
      <line x1="215" y1="247" x2="225" y2="247" stroke-width="3"/>
      <!-- Temple arms -->
      <line x1="145" y1="235" x2="125" y2="230" stroke-width="3"/>
      <line x1="295" y1="235" x2="315" y2="230" stroke-width="3"/>
    </g>
    
    <!-- Eyes behind glasses -->
    <ellipse cx="180" cy="247" rx="8" ry="6" fill="#1D1D1F"/>
    <ellipse cx="260" cy="247" rx="8" ry="6" fill="#1D1D1F"/>
    
    <!-- Nose -->
    <path d="M220 250 L220 290 Q220 300 215 305" stroke="#6B4F12" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Mouth - subtle smile -->
    <path d="M190 330 Q220 345 250 330" stroke="#5A4510" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Subtle cheek highlights -->
    <ellipse cx="160" cy="290" rx="15" ry="10" fill="rgba(255,255,255,0.08)"/>
    <ellipse cx="280" cy="290" rx="15" ry="10" fill="rgba(255,255,255,0.08)"/>
  </g>
  
  <!-- Decorative tech elements -->
  <g opacity="0.15">
    <rect x="50" y="550" width="60" height="60" rx="12" fill="#0071E3"/>
    <rect x="530" y="100" width="40" height="40" rx="8" fill="#0071E3"/>
    <circle cx="560" cy="600" r="25" fill="#0071E3"/>
  </g>
</svg>