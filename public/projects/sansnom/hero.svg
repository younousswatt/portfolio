<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F5F5F7"/>
  
  <!-- Subtle gradient -->
  <defs>
    <linearGradient id="webBg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8EB"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#webBg)"/>
  
  <!-- Abstract background elements -->
  <circle cx="600" cy="400" r="350" fill="rgba(0, 113, 227, 0.03)"/>
  <circle cx="150" cy="200" r="120" fill="rgba(0, 113, 227, 0.02)"/>
  <circle cx="1050" cy="600" r="100" fill="rgba(0, 113, 227, 0.02)"/>
  
  <!-- Browser window mockup -->
  <g transform="translate(200, 100)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="800" height="550" rx="16" fill="#1D1D1F"/>
    <rect x="8" y="8" width="784" height="534" rx="12" fill="#F5F5F7"/>
    
    <!-- Browser header -->
    <rect x="8" y="8" width="784" height="40" rx="12" fill="#E8E8EB"/>
    <circle cx="30" cy="28" r="6" fill="#FF5F57"/>
    <circle cx="50" cy="28" r="6" fill="#FEBC2E"/>
    <circle cx="70" cy="28" r="6" fill="#28C840"/>
    <rect x="100" y="20" width="200" height="16" rx="8" fill="#FFFFFF"/>
    
    <!-- Address bar content -->
    <rect x="320" y="48" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#E8E8EB"/>
    <text x="330" y="68" font-family="Arial" font-size="10" fill="#666a72">sansnom.app</text>
    
    <!-- Web content -->
    <rect x="40" y="100" width="200" height="40" rx="8" fill="#0071E3" opacity="0.1"/>
    <text x="60" y="125" font-family="Arial" font-size="14" font-weight="600" fill="#0071E3">SansNom</text>
    
    <!-- Dashboard cards -->
    <rect x="40" y="160" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#E8E8EB"/>
    <rect x="50" y="175" width="40" height="40" rx="8" fill="#0071E3" opacity="0.2"/>
    <rect x="50" y="225" width="80" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="50" y="240" width="60" height="8" rx="4" fill="#E8E8EB"/>
    
    <rect x="220" y="160" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#E8E8EB"/>
    <rect x="230" y="175" width="40" height="40" rx="8" fill="#0071E3" opacity="0.2"/>
    <rect x="230" y="225" width="80" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="230" y="240" width="60" height="8" rx="4" fill="#E8E8EB"/>
    
    <rect x="400" y="160" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#E8E8EB"/>
    <rect x="410" y="175" width="40" height="40" rx="8" fill="#0071E3" opacity="0.2"/>
    <rect x="410" y="225" width="80" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="410" y="240" width="60" height="8" rx="4" fill="#E8E8EB"/>
    
    <rect x="580" y="160" width="160" height="100" rx="12" fill="#FFFFFF" stroke="#E8E8EB"/>
    <rect x="590" y="175" width="40" height="40" rx="8" fill="#0071E3" opacity="0.2"/>
    <rect x="590" y="225" width="80" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="590" y="240" width="60" height="8" rx="4" fill="#E8E8EB"/>
    
    <!-- Code section -->
    <rect x="40" y="290" width="720" height="200" rx="12" fill="#1D1D1F"/>
    <text x="60" y="320" font-family="monospace" font-size="12" fill="#28C840">// API endpoint</text>
    <text x="60" y="340" font-family="monospace" font-size="12" fill="#FEBC2E">app.get</text>
    <text x="60" y="360" font-family="monospace" font-size="12" fill="#FFFFFF">('/api/users', async (req, res) => {</text>
    <text x="80" y="380" font-family="monospace" font-size="12" fill="#666a72">// Fetch users from database</text>
    <text x="80" y="400" font-family="monospace" font-size="12" fill="#FF5F57">const</text>
    <text x="80" y="420" font-family="monospace" font-size="12" fill="#FFFFFF">users = await db.users.findMany();</text>
    <text x="80" y="440" font-family="monospace" font-size="12" fill="#28C840">return</text>
    <text x="80" y="460" font-family="monospace" font-size="12" fill="#FFFFFF">res.json(users);</text>
    <text x="60" y="480" font-family="monospace" font-size="12" fill="#FFFFFF">});</text>
  </g>
  
  <!-- Database icon -->
  <g transform="translate(100, 680)">
    <ellipse cx="40" cy="20" rx="40" ry="15" fill="#0071E3" opacity="0.3"/>
    <rect x="0" y="20" width="80" height="60" fill="#0071E3" opacity="0.3"/>
    <ellipse cx="40" cy="80" rx="40" ry="15" fill="#0071E3" opacity="0.3"/>
  </g>
  
  <!-- Server icon -->
  <g transform="translate(1000, 680)">
    <rect x="0" y="0" width="80" height="30" rx="4" fill="#0071E3" opacity="0.3"/>
    <rect x="0" y="40" width="80" height="30" rx="4" fill="#0071E3" opacity="0.3"/>
    <rect x="0" y="80" width="80" height="30" rx="4" fill="#0071E3" opacity="0.3"/>
  </g>
</svg>