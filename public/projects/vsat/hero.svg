<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F5F5F7"/>
  
  <!-- Subtle gradient -->
  <defs>
    <linearGradient id="vsatBg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8EB"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#vsatBg)"/>
  
  <!-- Abstract background elements -->
  <circle cx="600" cy="400" r="350" fill="rgba(0, 113, 227, 0.03)"/>
  <circle cx="200" cy="150" r="100" fill="rgba(0, 113, 227, 0.02)"/>
  <circle cx="1000" cy="650" r="80" fill="rgba(0, 113, 227, 0.02)"/>
  
  <!-- Earth globe -->
  <g transform="translate(600, 400)">
    <!-- Globe -->
    <circle cx="0" cy="0" r="180" fill="#0071E3" opacity="0.1"/>
    <circle cx="0" cy="0" r="160" fill="#E8E8EB"/>
    
    <!-- Continents (simplified) -->
    <path d="M-80 -60 Q-40 -80 0 -60 Q40 -40 60 -20 Q80 0 60 40 Q40 80 0 60 Q-40 40 -80 20 Q-100 0 -80 -60" fill="#0071E3" opacity="0.2"/>
    <path d="M40 -80 Q80 -60 100 -40 Q120 -20 100 0 Q80 20 60 0 Q40 -20 40 -80" fill="#0071E3" opacity="0.2"/>
    <path d="M-100 40 Q-80 60 -60 80 Q-40 100 -20 80 Q0 60 -20 40 Q-40 20 -60 40 Q-80 60 -100 40" fill="#0071E3" opacity="0.2"/>
    
    <!-- Grid lines -->
    <ellipse cx="0" cy="0" rx="160" ry="160" fill="none" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="160" ry="80" fill="none" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="160" ry="40" fill="none" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
    <line x1="-80" y1="-138" x2="-80" y2="138" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
    <line x1="80" y1="-138" x2="80" y2="138" stroke="#0071E3" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Satellite -->
  <g transform="translate(200, 150)">
    <!-- Satellite body -->
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#1D1D1F"/>
    
    <!-- Solar panels -->
    <rect x="-90" y="-15" width="50" height="30" rx="4" fill="#0071E3" opacity="0.4"/>
    <rect x="40" y="-15" width="50" height="30" rx="4" fill="#0071E3" opacity="0.4"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-20" x2="0" y2="-50" stroke="#1D1D1F" stroke-width="3"/>
    <circle cx="0" cy="-55" r="8" fill="#1D1D1F"/>
  </g>
  
  <!-- VSAT dish on ground -->
  <g transform="translate(950, 600)">
    <!-- Dish -->
    <path d="M-50 0 Q0 -60 50 0" fill="#1D1D1F" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="#E8E8EB"/>
    
    <!-- Stand -->
    <rect x="-5" y="0" width="10" height="40" fill="#1D1D1F"/>
    <rect x="-20" y="35" width="40" height="10" rx="2" fill="#1D1D1F"/>
    
    <!-- Signal waves -->
    <path d="M-60 -20 Q-40 -40 0 -40 Q40 -40 60 -20" fill="none" stroke="#0071E3" stroke-width="2" opacity="0.5"/>
    <path d="M-70 -30 Q-40 -55 0 -55 Q40 -55 70 -30" fill="none" stroke="#0071E3" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Signal path -->
  <path d="M170 180 Q300 250 400 350 Q500 450 600 400 Q700 350 800 450 Q900 550 950 580" 
        fill="none" stroke="#0071E3" stroke-width="3" stroke-dasharray="10,5" opacity="0.6"/>
  
  <!-- Link budget visualization -->
  <g transform="translate(100, 550)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#E8E8EB"/>
    <text x="20" y="30" font-family="Arial" font-size="12" font-weight="600" fill="#1D1D1F">Link Budget</text>
    
    <text x="20" y="60" font-family="Arial" font-size="10" fill="#666a72">Uplink: 45 dB</text>
    <rect x="20" y="70" width="120" height="6" rx="3" fill="#0071E3"/>
    
    <text x="20" y="90" font-family="Arial" font-size="10" fill="#666a72">Downlink: 42 dB</text>
    <rect x="20" y="100" width="110" height="6" rx="3" fill="#0071E3" opacity="0.7"/>
    
    <text x="20" y="120" font-family="Arial" font-size="10" fill="#666a72">Margin: 8 dB</text>
    <rect x="20" y="130" width="60" height="6" rx="3" fill="#28C840"/>
  </g>
  
  <!-- DVB-S2X badge -->
  <g transform="translate(900, 150)">
    <rect x="0" y="0" width="120" height="50" rx="10" fill="#0071E3" opacity="0.1"/>
    <text x="20" y="30" font-family="Arial" font-size="12" font-weight="600" fill="#0071E3">DVB-S2X</text>
  </g>
  
  <!-- Network nodes -->
  <g opacity="0.2">
    <circle cx="300" cy="300" r="8" fill="#0071E3"/>
    <circle cx="450" cy="250" r="6" fill="#0071E3"/>
    <circle cx="700" cy="350" r="8" fill="#0071E3"/>
    <circle cx="850" cy="400" r="6" fill="#0071E3"/>
  </g>
</svg>