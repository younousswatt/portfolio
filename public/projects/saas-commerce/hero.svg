<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#F5F5F7"/>
  
  <!-- Subtle gradient -->
  <defs>
    <linearGradient id="saasBg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8EB"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#saasBg)"/>
  
  <!-- Abstract background elements -->
  <circle cx="600" cy="400" r="350" fill="rgba(0, 113, 227, 0.03)"/>
  <circle cx="180" cy="180" r="100" fill="rgba(0, 113, 227, 0.02)"/>
  <circle cx="1020" cy="620" r="90" fill="rgba(0, 113, 227, 0.02)"/>
  
  <!-- Dashboard mockup -->
  <g transform="translate(150, 80)">
    <!-- Main dashboard card -->
    <rect x="0" y="0" width="900" height="600" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="200" height="40" rx="10" fill="#0071E3" opacity="0.1"/>
    <text x="40" y="48" font-family="Arial" font-size="16" font-weight="600" fill="#0071E3">Business Dashboard</text>
    
    <!-- Stats row -->
    <rect x="20" y="80" width="200" height="100" rx="12" fill="#F5F5F7"/>
    <text x="40" y="110" font-family="Arial" font-size="12" fill="#666a72">Total Revenue</text>
    <text x="40" y="140" font-family="Arial" font-size="24" font-weight="600" fill="#1D1D1F">$12,450</text>
    <rect x="40" y="155" width="80" height="6" rx="3" fill="#0071E3"/>
    
    <rect x="240" y="80" width="200" height="100" rx="12" fill="#F5F5F7"/>
    <text x="260" y="110" font-family="Arial" font-size="12" fill="#666a72">Orders</text>
    <text x="260" y="140" font-family="Arial" font-size="24" font-weight="600" fill="#1D1D1F">847</text>
    <rect x="260" y="155" width="60" height="6" rx="3" fill="#28C840"/>
    
    <rect x="460" y="80" width="200" height="100" rx="12" fill="#F5F5F7"/>
    <text x="480" y="110" font-family="Arial" font-size="12" fill="#666a72">Customers</text>
    <text x="480" y="140" font-family="Arial" font-size="24" font-weight="600" fill="#1D1D1F">324</text>
    <rect x="480" y="155" width="50" height="6" rx="3" fill="#FEBC2E"/>
    
    <rect x="680" y="80" width="200" height="100" rx="12" fill="#F5F5F7"/>
    <text x="700" y="110" font-family="Arial" font-size="12" fill="#666a72">Products</text>
    <text x="700" y="140" font-family="Arial" font-size="24" font-weight="600" fill="#1D1D1F">156</text>
    <rect x="700" y="155" width="70" height="6" rx="3" fill="#FF5F57"/>
    
    <!-- Main content area -->
    <rect x="20" y="200" width="400" height="380" rx="12" fill="#F5F5F7"/>
    <text x="40" y="230" font-family="Arial" font-size="14" font-weight="600" fill="#1D1D1F">Recent Orders</text>
    
    <!-- Order items -->
    <rect x="40" y="250" width="360" height="50" rx="8" fill="#FFFFFF"/>
    <rect x="50" y="265" width="30" height="20" rx="4" fill="#0071E3" opacity="0.2"/>
    <rect x="90" y="265" width="120" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="90" y="280" width="80" height="6" rx="3" fill="#E8E8EB"/>
    <text x="350" y="280" font-family="Arial" font-size="12" fill="#28C840">$45</text>
    
    <rect x="40" y="310" width="360" height="50" rx="8" fill="#FFFFFF"/>
    <rect x="50" y="325" width="30" height="20" rx="4" fill="#0071E3" opacity="0.2"/>
    <rect x="90" y="325" width="100" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="90" y="340" width="70" height="6" rx="3" fill="#E8E8EB"/>
    <text x="350" y="340" font-family="Arial" font-size="12" fill="#28C840">$32</text>
    
    <rect x="40" y="370" width="360" height="50" rx="8" fill="#FFFFFF"/>
    <rect x="50" y="385" width="30" height="20" rx="4" fill="#0071E3" opacity="0.2"/>
    <rect x="90" y="385" width="140" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="90" y="400" width="90" height="6" rx="3" fill="#E8E8EB"/>
    <text x="350" y="400" font-family="Arial" font-size="12" fill="#28C840">$78</text>
    
    <rect x="40" y="430" width="360" height="50" rx="8" fill="#FFFFFF"/>
    <rect x="50" y="445" width="30" height="20" rx="4" fill="#0071E3" opacity="0.2"/>
    <rect x="90" y="445" width="110" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="90" y="460" width="75" height="6" rx="3" fill="#E8E8EB"/>
    <text x="350" y="460" font-family="Arial" font-size="12" fill="#28C840">$56</text>
    
    <rect x="40" y="490" width="360" height="50" rx="8" fill="#FFFFFF"/>
    <rect x="50" y="505" width="30" height="20" rx="4" fill="#0071E3" opacity="0.2"/>
    <rect x="90" y="505" width="95" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="90" y="520" width="65" height="6" rx="3" fill="#E8E8EB"/>
    <text x="350" y="520" font-family="Arial" font-size="12" fill="#28C840">$41</text>
    
    <!-- Inventory section -->
    <rect x="440" y="200" width="440" height="180" rx="12" fill="#F5F5F7"/>
    <text x="460" y="230" font-family="Arial" font-size="14" font-weight="600" fill="#1D1D1F">Inventory Status</text>
    
    <rect x="460" y="250" width="200" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="460" y="250" width="160" height="8" rx="4" fill="#28C840"/>
    <text x="670" y="258" font-family="Arial" font-size="10" fill="#666a72">80%</text>
    
    <rect x="460" y="280" width="200" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="460" y="280" width="120" height="8" rx="4" fill="#FEBC2E"/>
    <text x="670" y="288" font-family="Arial" font-size="10" fill="#666a72">60%</text>
    
    <rect x="460" y="310" width="200" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="460" y="310" width="180" height="8" rx="4" fill="#0071E3"/>
    <text x="670" y="318" font-family="Arial" font-size="10" fill="#666a72">90%</text>
    
    <rect x="460" y="340" width="200" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="460" y="340" width="80" height="8" rx="4" fill="#FF5F57"/>
    <text x="670" y="348" font-family="Arial" font-size="10" fill="#666a72">40%</text>
    
    <!-- Customer management -->
    <rect x="440" y="400" width="440" height="180" rx="12" fill="#F5F5F7"/>
    <text x="460" y="430" font-family="Arial" font-size="14" font-weight="600" fill="#1D1D1F">Customer Management</text>
    
    <circle cx="480" cy="470" r="20" fill="#0071E3" opacity="0.2"/>
    <rect x="520" y="455" width="100" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="520" y="470" width="70" height="6" rx="3" fill="#E8E8EB"/>
    
    <circle cx="480" cy="520" r="20" fill="#0071E3" opacity="0.2"/>
    <rect x="520" y="505" width="120" height="8" rx="4" fill="#E8E8EB"/>
    <rect x="520" y="520" width="85" height="6" rx="3" fill="#E8E8EB"/>
  </g>
  
  <!-- POS icon -->
  <g transform="translate(150, 720)">
    <rect x="0" y="0" width="60" height="50" rx="8" fill="#0071E3" opacity="0.3"/>
    <rect x="10" y="10" width="40" height="30" rx="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Invoice icon -->
  <g transform="translate(250, 720)">
    <rect x="0" y="0" width="50" height="60" rx="6" fill="#0071E3" opacity="0.3"/>
    <rect x="10" y="10" width="30" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="10" y="20" width="30" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="10" y="30" width="20" height="4" rx="2" fill="#FFFFFF"/>
  </g>
</svg>